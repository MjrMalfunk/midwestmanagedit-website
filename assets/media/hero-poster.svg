    <rect x="280" y="224" width="160" height="16" rx="8"/>
    <rect x="280" y="256" width="320" height="12" rx="6" opacity="0.86"/>
    <rect x="280" y="280" width="280" height="12" rx="6" opacity="0.68"/>
    <rect x="280" y="322" width="64" height="64" rx="15" fill="#5b9eff" fill-opacity="0.2"/>
    <rect x="356" y="322" width="64" height="64" rx="15" fill="#72efd7" fill-opacity="0.18"/>
    <rect x="432" y="322" width="64" height="64" rx="15" fill="#5b9eff" fill-opacity="0.12"/>
