    <circle cx="520" cy="520" r="8" fill="#72efd7" fill-opacity="0.6"/>
    <circle cx="1020" cy="365" r="8" fill="#72efd7" fill-opacity="0.55"/>
    <circle cx="1310" cy="485" r="7" fill="#92c3ff" fill-opacity="0.62"/>
  </g>

  <g fill="#dce9ff" fill-opacity="0.1" stroke="#92c3ff" stroke-opacity="0.2">
    <rect x="980" y="130" width="360" height="190" rx="22"/>
    <rect x="1020" y="175" width="130" height="18" rx="9"/>
    <rect x="1020" y="205" width="210" height="14" rx="7" opacity="0.8"/>
    <rect x="1020" y="232" width="174" height="14" rx="7" opacity="0.65"/>
    <rect x="1248" y="175" width="56" height="56" rx="12" fill="#72efd7" fill-opacity="0.18"/>
    <circle cx="1276" cy="203" r="10" fill="#72efd7" fill-opacity="0.56"/>
  </g>

  <g fill="#dce9ff" fill-opacity="0.08" stroke="#92c3ff" stroke-opacity="0.24">
