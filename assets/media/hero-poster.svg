<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Abstract managed IT and cybersecurity background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1726"/>
      <stop offset="0.55" stop-color="#111f32"/>
      <stop offset="1" stop-color="#16283d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.78" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#5b9eff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5b9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.18" cy="0.76" r="0.42">
      <stop offset="0" stop-color="#72efd7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#72efd7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dce9ff" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowTeal)"/>

  <g stroke="#92c3ff" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M120 700C290 620 360 610 520 520S840 340 1020 365 1350 500 1490 410"/>
