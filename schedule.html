<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading your scheduler | Midwest Managed IT</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Securely loading your Midwest Managed IT estimate scheduling context.">
  <link rel="icon" href="assets/brand/mmit-favicon.ico">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .schedule-loader-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at top left, rgba(77, 150, 255, 0.22), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.12), transparent 28rem),
        var(--bg-primary, #10233a);
    }
    .schedule-loader-card {
      width: min(720px, 100%);
      text-align: center;
      padding: clamp(32px, 5vw, 58px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 28px;
      background: rgba(18, 33, 53, 0.88);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      color: #f8fafc;
    }
    .schedule-loader-card img {
      width: 220px;
      max-width: 72%;
      height: auto;
      margin-bottom: 26px;
      background: #ffffff;
      border-radius: 2px;
      padding: 8px;
    }
    .schedule-loader-kicker {
      display: block;
      margin-bottom: 12px;
      color: #93c5fd;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .schedule-loader-card h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 1.05;
    }
    .schedule-loader-card p {
      margin: 0 auto 22px;
      max-width: 560px;
      color: rgba(226, 232, 240, 0.88);
      font-size: 1.05rem;
      line-height: 1.65;
    }
    .loader-dots {
      display: inline-flex;
      gap: 8px;
      margin: 8px 0 28px;
    }
    .loader-dots span {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #60a5fa;
      animation: loaderPulse 1.1s infinite ease-in-out;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.16s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes loaderPulse {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <main class="schedule-loader-page">
    <section class="schedule-loader-card" aria-live="polite">
      <img src="assets/brand/mmit-logo-horizontal-light.svg" alt="Midwest Managed IT">
      <span class="schedule-loader-kicker">Secure estimate handoff</span>
      <h1>Loading your scheduler</h1>
      <p id="scheduleLoaderMessage">We are securely retrieving your estimate details so you do not have to re-enter everything.</p>
      <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p>
        <a class="btn btn-primary" id="manualScheduleLink" href="contact.html#schedule-intake">Continue to scheduler</a>
      </p>
    </section>
  </main>

  <script>
    (() => {
      const storageKey = 'mmit-schedule-intake-v1';
      const message = document.getElementById('scheduleLoaderMessage');
      const manualLink = document.getElementById('manualScheduleLink');
      const params = new URLSearchParams(window.location.search);
      const token = (params.get('estimate') || '').trim();
      const redirectToScheduler = () => window.location.replace('contact.html#schedule-intake');

      function setMessage(text) {
        if (message) message.textContent = text;
      }

      function saveScheduleFields(fields) {
        try {
          window.sessionStorage.setItem(storageKey, JSON.stringify({
            version: 1,
            savedAt: Date.now(),
            source: 'secure-estimate-link',
            fields: fields || {}
          }));
        } catch (error) {}
      }

      if (!token) {
        setMessage('No estimate token was found. Sending you to the scheduler now.');
        window.setTimeout(redirectToScheduler, 650);
        return;
      }

      fetch('api/estimate-link.php?estimate=' + encodeURIComponent(token), {
        method: 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { 'Accept': 'application/json' }
      })
        .then((response) => response.json().then((data) => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
          if (!ok || !data || !data.ok) {
            throw new Error((data && data.message) || 'This estimate link could not be loaded.');
          }
          saveScheduleFields(data.fields || {});
          setMessage('Your estimate context is ready. Opening the scheduler now.');
          window.setTimeout(redirectToScheduler, 450);
        })
        .catch((error) => {
          setMessage((error && error.message ? error.message : 'This estimate link could not be loaded.') + ' You can still continue to the scheduler and enter your details manually.');
          if (manualLink) manualLink.focus();
        });
    })();
  </script>
</body>
</html>
